<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rose Day</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Dancing Script', cursive; /* Romantic cursive font */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%), url('https://www.transparenttextures.com/patterns/flowers.png'); /* Soft pink gradient with subtle floral overlay */
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            position: relative;
            border: 4px solid #ff1493; /* Vibrant pink border for the main container */
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.3);
            max-width: 90vw; /* Responsive width */
            max-height: 90vh; /* Responsive height */
            background: rgba(255, 255, 255, 0.1); /* Semi-transparent white for layering */
        }

        .tap-message {
            font-size: 18px;
            color: #ff4500; /* Orange-red for contrast */
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in-out;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .rose {
            width: 250px;
            height: 250px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .rose:hover {
            transform: scale(1.1);
        }

        .message-popup {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #ffb6c1; /* Light pink border with gold accent */
            border-image: linear-gradient(45deg, #ffb6c1, #ffd700) 1;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-size: 24px;
            color: #dc143c; /* Crimson for romance */
            animation: fadeIn 2s ease-in-out;
            display: none; /* Initially hidden */
            z-index: 10;
            max-width: 80vw; /* Constrain width to prevent overflow */
        }

        .poem {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #dc143c 0%, #b22222 50%, #8b0000 100%); /* Bright red parchment gradient */
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxmaWx0ZXIgaWQ9Im5vaXNlIj4KICAgICAgPGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuOSIgbnVtT2N0YXZlcz0iNCIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPgogICAgPC9maWx0ZXI+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNub2lzZSkiIG9wYWNpdHk9IjAuMyIvPgo8L3N2Zz4='); /* Subtle noise texture for old paper effect */
            padding: 30px;
            border-radius: 20px;
            border: 5px solid #ffd700; /* Romantic yellow border for aesthetic appeal */
            border-image: linear-gradient(45deg, #ffd700, #ff69b4, #dc143c) 1; /* Yellow-pink-red gradient for romance */
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.2);
            font-size: 18px;
            color: #ffb6c1; /* Light pink text color for cuteness */
            line-height: 1.6;
            white-space: pre-line;
            display: none; /* Initially hidden */
            width: 550px; /* Increased fixed width for proper line fitting */
            max-width: 90vw; /* Responsive fallback */
            z-index: 20;
        }

        .line {
            opacity: 0; /* Initially hidden for animation */
            transition: opacity 1s ease-in-out;
            border: 1px solid #ffd700; /* Subtle yellow border around each line for cuteness */
            border-radius: 5px;
            padding: 5px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1); /* Slight transparency for layering */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Increased hearts and flowers floating across the whole screen for more romance */
        .floating-element {
            position: absolute;
            font-size: 20px;
            animation: float 10s ease-in-out infinite;
            opacity: 0.8;
        }

        /* Hearts distributed across screen */
        .heart:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; }
        .heart:nth-child(2) { top: 10%; right: 10%; animation-delay: 0.5s; }
        .heart:nth-child(3) { top: 15%; left: 20%; animation-delay: 1s; }
        .heart:nth-child(4) { top: 20%; right: 25%; animation-delay: 1.5s; }
        .heart:nth-child(5) { top: 25%; left: 30%; animation-delay: 2s; }
        .heart:nth-child(6) { top: 30%; right: 35%; animation-delay: 2.5s; }
        .heart:nth-child(7) { bottom: 5%; left: 10%; animation-delay: 3s; }
        .heart:nth-child(8) { bottom: 10%; right: 15%; animation-delay: 3.5s; }
        .heart:nth-child(9) { bottom: 15%; left: 25%; animation-delay: 4s; }
        .heart:nth-child(10) { bottom: 20%; right: 30%; animation-delay: 4.5s; }
        .heart:nth-child(11) { bottom: 25%; left: 35%; animation-delay: 5s; }
        .heart:nth-child(12) { bottom: 30%; right: 40%; animation-delay: 5.5s; }
        .heart:nth-child(13) { top: 35%; left: 40%; animation-delay: 6s; }
        .heart:nth-child(14) { top: 40%; right: 45%; animation-delay: 6.5s; }
        .heart:nth-child(15) { bottom: 35%; left: 45%; animation-delay: 7s; }
        .heart:nth-child(16) { bottom: 40%; right: 50%; animation-delay: 7.5s; }

        /* Flowers distributed across screen */
        .flower:nth-child(1) { top: 8%; right: 5%; animation-delay: 0.2s; }
        .flower:nth-child(2) { top: 12%; left: 15%; animation-delay: 0.7s; }
        .flower:nth-child(3) { top: 18%; right: 20%; animation-delay: 1.2s; }
        .flower:nth-child(4) { top: 22%; left: 25%; animation-delay: 1.7s; }
        .flower:nth-child(5) { top: 28%; right: 30%; animation-delay: 2.2s; }
        .flower:nth-child(6) { bottom: 8%; left: 5%; animation-delay: 2.7s; }
        .flower:nth-child(7) { bottom: 12%; right: 10%; animation-delay: 3.2s; }
        .flower:nth-child(8) { bottom: 18%; left: 20%; animation-delay: 3.7s; }
        .flower:nth-child(9) { bottom: 22%; right: 25%; animation-delay: 4.2s; }
        .flower:nth-child(10) { bottom: 28%; left: 30%; animation-delay: 4.7s; }
        .flower:nth-child(11) { top: 32%; left: 35%; animation-delay: 5.2s; }
        .flower:nth-child(12) { top: 38%; right: 40%; animation-delay: 5.7s; }
        .flower:nth-child(13) { bottom: 32%; left: 40%; animation-delay: 6.2s; }
        .flower:nth-child(14) { bottom: 38%; right: 45%; animation-delay: 6.7s; }

        /* Sparkles for extra cuteness and romance */
        .sparkle {
            position: absolute;
            font-size: 16px;
            color: #ffd700;
            animation: sparkle 4s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 50%; left: 50%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 60%; right: 60%; animation-delay: 1s; }
        .sparkle:nth-child(3) { bottom: 50%; left: 60%; animation-delay: 2s; }
        .sparkle:nth-child(4) { bottom: 60%; right: 50%; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-40px) rotate(10deg); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Media queries for phone-friendliness */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
                max-width: 95vw;
                max-height: 95vh;
            }
            .tap-message {
                font-size: 16px;
                margin-bottom: 15px;
            }
            .rose {
                width: 200px;
                height: 200px;
            }
            .message-popup {
                font-size: 20px;
                padding: 15px;
                top: 15%;
            }
            .poem {
                font-size: 16px;
                padding: 20px;
                width: 90vw; /* Responsive width for mobile */
            }
            .floating-element {
                font-size: 16px;
            }
            .sparkle {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .tap-message {
                font-size: 14px;
            }
            .rose {
                width: 150px;
                height: 150px;
            }
            .message-popup {
                font-size: 18px;
                padding: 10px;
            }
            .poem {
                font-size: 14px;
                padding: 15px;
                width: 95vw;
            }
            .floating-element {
                font-size: 14px;
            }
            .sparkle {
                font-size: 10px;
            }
        }

        /* Media query for desktop-friendliness (larger screens) */
        @media (min-width: 1200px) {
            .container {
                max-width: 700px; /* Slightly larger for desktops */
                max-height: 85vh;
            }
            .tap-message {
                font-size: 22px;
            }
            .rose {
                width: 320px; /* Larger for desktop */
                height: 320px;
            }
            .message-popup {
                font-size: 28px;
                padding: 30px;
                max-width: 600px;
            }
            .poem {
                font-size: 22px;
                padding: 40px;
                width: 650px; /* Wider for proper lines on desktop */
            }
            .floating-element {
                font-size: 26px;
            }
            .sparkle {
                font-size: 20px;
            }
        }
    </style>
</head>
